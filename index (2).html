<style>
:root{--bg:#eef3ff;--card:#ffffffdd;--tx:#0b1d4a;--mut:#6b7a99;--ac:#1f4fd8;--ac2:#00c2ff;--ac3:#8b5cf6;--on:#fff;--b1:#ffb020;--b2:#7c4dff;--b3:#00bfa5;--b4:#ff4081}
[data-t=redwhite]{--bg:#fff0f1;--tx:#3a0a0a;--mut:#8a6a6a;--ac:#d61f2c;--ac2:#ff8a3d;--ac3:#ff3d81}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:88px;min-height:100vh;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(70px);opacity:.35;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
body::before{background:var(--ac2);top:-80px;right:-100px}body::after{background:var(--ac3);bottom:-80px;left:-100px;animation-delay:-6s}
@keyframes fl{to{transform:translate(-60px,80px) scale(1.25)}}
#splash{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 35%,#2a5cff,#12084a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .7s,visibility .7s}
#splash.off{opacity:0;visibility:hidden}
#splash img{width:130px;height:130px;border-radius:32px;animation:pop 1.2s cubic-bezier(.2,1.4,.4,1),glow 2.4s infinite 1.2s}

#splash h1{letter-spacing:.5em;margin:26px 0 4px;font-size:34px;animation:rise 1.2s .5s both;background:linear-gradient(90deg,#fff,#7fd8ff,#ff9ad5,#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1.2s .5s both,shine 3s linear infinite}
#splash p{opacity:.8;margin:0;animation:rise 1.2s .9s both}
.bar{width:150px;height:5px;border-radius:5px;background:#ffffff33;margin-top:26px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb020,#ff4081,#7c4dff);animation:ld 2.2s forwards}

function isAdmin(){return !!user && ADMIN_EMAILS.includes((user.email||'').toLowerCase())}
function vCom(){if(!FB.apiKey)return `<div class="card"><h3>👥 ${t('com')}</h3><p>Firebase config is empty. Paste your keys at the top of index.html.</p></div>`;
 if(!user)return `<div class="card"><h3>👤 ${t('reg')} / ${t('login')}</h3><label>${t('name')}</label><input id="nm"><label>${t('email')}</label><input id="em" type="email"><label>${t('pw')}</label><input id="pw" type="password"><button class="btn" onclick="signup()">${t('reg')}</button><br><br><button class="btn" style="background:#8886" onclick="login()">${t('login')}</button><br><br><button class="btn s" style="background:#5556" onclick="resetPassword()">🔑 Forgot Password?</button></div>`;
 return `<div class="card community-head"><div><b>👥 LINKON Community</b><div style="color:var(--mut);font-size:12px">Share • Help • OT tips • Updates</div></div><div style="display:flex;gap:6px"><button class="btn s" onclick="setNotice()" style="display:${isAdmin()?'inline-block':'none'}">📢 Admin Notice</button><button class="btn s" onclick="doLogout()">${t('out')}</button></div></div>
 <div class="card"><h3>📢 Community Notice</h3><div id="notice">Loading notice…</div></div>
 <div class="card"><textarea id="tx" rows="3" placeholder="${t('say')}"></textarea><div class="v2grid" style="grid-template-columns:1fr 1fr"><select id="cat"><option value="general">💬 General</option><option value="help">🆘 Help</option><option value="ot">⏱️ OT Tips</option><option value="notice">📢 Notice</option></select><input type="file" id="ph" accept="image/*"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn s" onclick="doPost()">📤 ${t('post')}</button></div></div>
 <div class="card"><div style="display:flex;gap:6px"><input id="communitySearch" placeholder="🔎 Search community posts…" oninput="renderCommunityFeed()" style="flex:1"><button class="btn s" onclick="loadPosts()">🔄</button></div></div><div id="feed"></div>`}
let firebaseReady=false, firebaseLoading=null;
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=resolve;s.onerror=()=>reject(new Error('Could not load Firebase SDK'));document.head.appendChild(s)})}
async function initFB(){
  if(firebaseReady)return true;
  if(firebaseLoading)return firebaseLoading;
  if(!FB.apiKey)return false;
  firebaseLoading=(async()=>{
    try{
      if(typeof window.firebase==='undefined'){
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
      }
      if(!firebase.apps.length)firebase.initializeApp(FB);
      auth=firebase.auth();db=firebase.firestore();firebaseReady=true;
      auth.onAuthStateChanged(async u=>{user=u;if(u&&db)db.collection('users').doc(u.uid).set({name:u.displayName||u.email,joined:Date.now()},{merge:true}).catch(()=>{});authReady=true;if(u)sv('hadUser',true);render();if(tab==='com'&&user&&db)await loadPosts();});
      render();
      return true;
    }catch(e){firebaseReady=false;console.warn('Firebase unavailable:',e);return false;}
  })();
  return firebaseLoading;
}
async function ensureFirebase(){const ok=await initFB();if(!ok){alert('Firebase is not available right now. Please open LINKON OT from your HTTPS website or check your internet connection.');return false;}return true;}
function err(e){alert((e&&e.message)||'Something went wrong. Please try again.')}
async function signup(){
  if(!(await ensureFirebase()))return;
  const email=$('#em').value.trim(),pw=$('#pw').value,name=$('#nm').value.trim()||'Member';
  if(!email||!pw)return alert('Enter email and password.');
  try{const c=await auth.createUserWithEmailAndPassword(email,pw);await c.user.updateProfile({displayName:name});user=c.user;tab='home';authMode='choice';render();db.collection('users').doc(user.uid).set({name,joined:Date.now()},{merge:true}).catch(()=>{});}catch(e){err(e)}
}
async function login(){
  if(!(await ensureFirebase()))return;
  const email=$('#em').value.trim(),pw=$('#pw').value;
  if(!email||!pw)return alert('Enter email and password.');
  try{await auth.signInWithEmailAndPassword(email,pw); user=auth.currentUser; tab='home'; authMode='choice'; render(); }catch(e){ console.error('LOGIN ERROR',e); let m=(e&&e.code)||''; if(m==='auth/invalid-credential'||m==='auth/wrong-password'||m==='auth/user-not-found') alert('Login failed. Email or password is incorrect. If you forgot the password, use Forgot Password.'); else if(m==='auth/too-many-requests') alert('Too many attempts. Please wait and try again later.'); else err(e); }
}
async function resetPassword(){
  if(!(await ensureFirebase()))return;
  const email=$('#em').value.trim();
  if(!email)return alert('Enter your email first.');
  try{
    await auth.sendPasswordResetEmail(email);
    alert('Password reset email sent. Check your email inbox (and Spam/Junk folder).');
  }catch(e){
    if(e&&e.code==='auth/user-not-found') alert('No account found with this email.');
    else if(e&&e.code==='auth/invalid-email') alert('Please enter a valid email address.');
    else err(e);
  }
}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,720/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};i.src=URL.createObjectURL(f)})}
async function doPost(){const tx=$('#tx').value.trim(),f=$('#ph').files[0],cat=$('#cat').value;if(!tx&&!f)return alert('Write something or choose a photo.');const img=f?await shrink(f):'';
 await db.collection('posts').add({uid:user.uid,name:user.displayName||'Member',text:tx,img,cat,t:Date.now(),likes:[],comments:[]});$('#tx').value='';$('#ph').value='';loadPosts()}
async function loadPosts(){const el=$('#feed');if(!el||!db)return;try{const me=await db.collection('users').doc(user.uid).get();fol=(me.data()||{}).following||[];const q=await db.collection('posts').orderBy('t','desc').limit(50).get();communityPosts=q.docs.map(d=>({id:d.id,...d.data()}));renderCommunityFeed();loadNotice()}catch(e){el.innerHTML=`<div class="card">⚠️ ${esc(e.message)}</div>`}}
function catLabel(c){return ({general:'💬 General',help:'🆘 Help',ot:'⏱️ OT Tips',notice:'📢 Notice'})[c]||'💬 General'}
function renderCommunityFeed(){const el=$('#feed');if(!el)return;const q=($('#communitySearch')?.value||'').trim().toLowerCase();const arr=communityPosts.filter(p=>!q||String(p.text||'').toLowerCase().includes(q)||String(p.name||'').toLowerCase().includes(q)||String(p.cat||'').toLowerCase().includes(q));
 el.innerHTML=arr.length?arr.map(p=>postHTML(p)).join(''):`<div class="card" style="text-align:center;color:var(--mut)">No posts found.</div>`}
function postHTML(p){const lk=(p.likes||[]).includes(user.uid),f=fol.includes(p.uid),cs=p.comments||[];return `<div class="card post"><div><b>${esc(p.name||'Member')}</b> <span style="color:var(--mut);font-size:11px">• ${catLabel(p.cat)}</span>${p.uid!=user.uid?`<button class="btn s" style="float:right" onclick="follow('${p.uid}')">${f?t('fl'):t('follow')}</button>`:''}</div><div style="font-size:11px;color:var(--mut);margin:4px 0">${new Date(p.t||Date.now()).toLocaleString()}</div><div>${esc(p.text)}</div>${p.img?`<img src="${p.img}" style="max-width:100%;border-radius:12px;margin-top:8px">`:''}<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="btn s" onclick="like('${p.id}',${lk})">${lk?'❤️':'🤍'} ${(p.likes||[]).length}</button><button class="btn s" onclick="toggleComments('${p.id}')">💬 ${cs.length}</button><button class="btn s" onclick="reportPost('${p.id}')">🚩 Report</button>${p.uid==user.uid||isAdmin()?`<button class="btn s" onclick="deletePost('${p.id}')">🗑️ Delete</button>`:''}</div><div id="comments-${p.id}" style="display:none;margin-top:8px">${cs.map(c=>`<div style="padding:7px;border-top:1px solid var(--line)"><b>${esc(c.name)}</b> <span style="font-size:11px;color:var(--mut)">${new Date(c.t||Date.now()).toLocaleString()}</span><div>${esc(c.text)}</div></div>`).join('')}<div style="display:flex;gap:6px;margin-top:6px"><input id="comment-${p.id}" placeholder="Write a comment…"><button class="btn s" onclick="addComment('${p.id}')">Send</button></div></div></div>`}
function toggleComments(id){const e=$('#comments-'+id);if(e)e.style.display=e.style.display==='none'?'block':'none'}
async function addComment(id){const e=$('#comment-'+id),text=(e?.value||'').trim();if(!text)return;const F=firebase.firestore.FieldValue;await db.collection('posts').doc(id).update({comments:F.arrayUnion({uid:user.uid,name:user.displayName||'Member',text,t:Date.now()})});loadPosts()}
async function like(id,on){const F=firebase.firestore.FieldValue;await db.collection('posts').doc(id).update({likes:on?F.arrayRemove(user.uid):F.arrayUnion(user.uid)});loadPosts()}
async function follow(uid){const F=firebase.firestore.FieldValue,on=fol.includes(uid);await db.collection('users').doc(user.uid).set({following:on?F.arrayRemove(uid):F.arrayUnion(uid)},{merge:true});await db.collection('users').doc(uid).set({followers:on?F.arrayRemove(user.uid):F.arrayUnion(user.uid)},{merge:true});loadPosts()}
async function deletePost(id){if(!confirm('Delete this post?'))return;await db.collection('posts').doc(id).delete();loadPosts()}
async function reportPost(id){const reason=prompt('Why are you reporting this post?','Spam / inappropriate content');if(!reason)return;await db.collection('reports').add({postId:id,uid:user.uid,reason,t:Date.now(),status:'open'});alert('Report submitted. Thank you.')}
async function loadNotice(){const e=$('#notice');if(!e||!db)return;try{const d=await db.collection('community').doc('notice').get();const x=d.exists?d.data():null;e.innerHTML=x?.text?`<b>${esc(x.title||'Notice')}</b><div>${esc(x.text)}</div>`:'No new notice.'}catch(_){e.textContent='No notice available.'}}
async function setNotice(){if(!isAdmin())return;const title=prompt('Notice title','Community Notice');const text=prompt('Notice text');if(!text)return;await db.collection('community').doc('notice').set({title,text,t:Date.now(),by:user.email});loadNotice()}
function esc(s){return String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[c]))}
window.addEventListener('error',function(e){
  console.error('LINKON OT error:',e.error||e.message||e.filename);
});
window.addEventListener('unhandledrejection',function(e){
  console.error('LINKON OT promise error:',e.reason);
});
apply();render();setTimeout(()=>$('#splash').classList.add('off'),1200);setTimeout(()=>initFB().then(ok=>{if(!ok){authReady=true;render()}}),400);setTimeout(()=>{if(!authReady){authReady=true;render()}},4000);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script></body></html>
